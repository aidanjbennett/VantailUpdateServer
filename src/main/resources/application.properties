spring.application.name=VantailUpdateServer

# PostgreSQL connection. These defaults match the local docker-compose.yml setup;
# override them with environment variables when connecting to another database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vantail_update_server}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
update.publish-secret=${UPDATE_PUBLISH_SECRET:}
